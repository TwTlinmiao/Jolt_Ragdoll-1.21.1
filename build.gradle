plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    if (file('.gradle-local-maven/net/neoforged/neoforge/21.1.228/neoforge-21.1.228-userdev.jar').exists()) {
        exclusiveContent {
            forRepository {
                maven { url = uri("${rootDir}/.gradle-local-maven") }
            }
            filter {
                includeVersion('net.neoforged.jst', 'jst-cli-bundle', '2.0.6')
                includeVersion('net.neoforged', 'neoforge', neo_version)
                includeVersion('net.neoforged', 'neoform', '1.21.1-20240808.144430')
                includeVersion('net.neoforged', 'mergetool', '2.0.3')
                includeVersion('net.neoforged', 'AutoRenamingTool', '2.0.3')
                includeVersion('net.neoforged.installertools', 'installertools', '2.1.2')
                includeVersion('org.vineflower', 'vineflower', '1.10.1')
                includeVersion('net.neoforged.fancymodloader', 'loader', '4.0.42')
                includeVersion('net.neoforged.fancymodloader', 'earlydisplay', '4.0.42')
                includeVersion('net.neoforged', 'accesstransformers', '10.0.1')
                includeVersion('net.neoforged', 'coremods', '7.0.3')
                includeVersion('cpw.mods', 'modlauncher', '11.0.5')
                includeVersion('com.electronwill.night-config', 'toml', '3.8.3')
                includeVersion('com.electronwill.night-config', 'core', '3.8.3')
                includeVersion('net.fabricmc', 'sponge-mixin', '0.15.2+mixin.0.8.7')
                includeVersion('org.openjdk.nashorn', 'nashorn-core', '15.4')
                includeVersion('cpw.mods', 'securejarhandler', '3.0.8')
                includeVersion('org.ow2.asm', 'asm-commons', '9.8')
                includeVersion('org.ow2.asm', 'asm-util', '9.8')
                includeVersion('org.ow2.asm', 'asm-analysis', '9.8')
                includeVersion('org.ow2.asm', 'asm-tree', '9.8')
                includeVersion('org.ow2.asm', 'asm', '9.8')
                includeVersion('cpw.mods', 'bootstraplauncher', '2.0.2')
                includeVersion('net.neoforged', 'JarJarFileSystems', '0.4.1')
                includeVersion('io.github.llamalad7', 'mixinextras-neoforge', '0.5.3')
                includeVersion('org.antlr', 'antlr4-runtime', '4.13.1')
                includeVersion('com.google.errorprone', 'error_prone_annotations', '2.18.0')
                includeVersion('com.google.j2objc', 'j2objc-annotations', '2.8')
                includeVersion('org.ow2', 'ow2', '1.5.1')
                includeVersion('org.antlr', 'antlr4-master', '4.13.1')
                includeVersion('com.google.errorprone', 'error_prone_parent', '2.18.0')
                includeVersion('org.sonatype.oss', 'oss-parent', '9')
                includeVersion('net.neoforged.accesstransformers', 'at-modlauncher', '10.0.1')
                includeVersion('net.neoforged', 'mergetool', '2.0.0')
                includeVersion('net.neoforged', 'neoform-runtime', '2.0.18')
            }
        }
    }
    mavenCentral()
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top'
    }
    maven {
        name = 'WispForest'
        url = 'https://maven.wispforest.io/releases'
    }
}

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
def toolLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable = toolLauncher.map { it.executablePath.asFile.absolutePath }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Optional local test helper: -PquickPlayWorld=<save folder name>
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // Kept separate because the native-only Jolt artifact has the same Maven
    // identity as the Java API artifact. Embedding both as Jar-in-Jar entries
    // would make NeoForge treat them as competing copies of one library.
    joltNative
    joltApi
    joltAndroidNative
}

dependencies {
    // Optional GeckoLib 4 armor API; never bundled or required at runtime.
    compileOnly files('compat-libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    // Jolt-JNI exposes the Java API separately from its platform-native binary.
    implementation "com.github.stephengold:jolt-jni-Windows64:${jolt_jni_version}"
    joltApi "com.github.stephengold:jolt-jni-Windows64:${jolt_jni_version}"
    runtimeOnly "com.github.stephengold:jolt-jni-Windows64:${jolt_jni_version}:ReleaseSp"
    joltNative "com.github.stephengold:jolt-jni-Windows64:${jolt_jni_version}:ReleaseSp"
    joltAndroidNative "com.github.stephengold:jolt-jni-Android:${jolt_jni_version}:SpRelease@aar"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly("io.wispforest:accessories-neoforge:${accessories_version}") {
        transitive = false
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Keep Jolt classes and its Windows native visible to both the dev run's
// resource source set and the production jar. The API jar's module-info is
// intentionally omitted because it references unpublished test packages.
tasks.named('processResources', ProcessResources).configure {
    from({
        configurations.joltApi.collect { zipTree(it) }
    }) {
        include 'com/github/stephengold/joltjni/**'
        exclude 'module-info.class'
    }
    from({
        configurations.joltNative.collect { zipTree(it) }
    }) {
        include 'windows/**'
    }
    from({
        configurations.joltAndroidNative.collect { zipTree(it) }
    }) {
        include 'jni/arm64-v8a/libjoltjni.so'
        eachFile { details ->
            details.path = 'android/arm64-v8a/libjoltjni.so'
        }
        includeEmptyDirs = false
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

tasks.register('wearableRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath.filter {
        !it.name.startsWith('curios-') && !it.name.startsWith('accessories-') && !it.name.startsWith('geckolib-')
    }
    mainClass = 'com.ragdoll.compat.client.WearableRegressionChecks'
}

tasks.named('check') { dependsOn 'wearableRegression' }
tasks.register('geckoArmorRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.ragdoll.compat.client.GeckoArmorRegressionChecks'
}
tasks.named('check') { dependsOn 'geckoArmorRegression' }

tasks.register('backpackSnapshotRegression', JavaExec) {
    dependsOn testClasses
    mustRunAfter 'wearableRegression', 'geckoArmorRegression'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    classpath += files("build/moddev/artifacts/neoforge-${neo_version}-client-extra-aka-minecraft-resources.jar")
    mainClass = 'com.ragdoll.compat.client.BackpackSnapshotRegressionChecks'
}
tasks.named('check') { dependsOn 'backpackSnapshotRegression' }

tasks.register('poseSnapshotRegression', JavaExec) {
    dependsOn testClasses
    mustRunAfter 'backpackSnapshotRegression'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.ragdoll.client.physics.PoseSnapshotRegressionChecks'
}
tasks.named('check') { dependsOn 'poseSnapshotRegression' }

tasks.register('impactResponseRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.ragdoll.client.physics.ImpactResponseRegressionChecks'
}

tasks.named('check') { dependsOn 'impactResponseRegression' }

// The offline regression entry point runs through JavaExec, without a JUnit engine.
tasks.named('test') { failOnNoDiscoveredTests = false }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
